# Its own workspace root, so this repository builds on its own.
#
# Every module repository carries this and the template did not, which stopped
# mattering the moment the template stopped sitting beside the estate: nested at
# template/rust, cargo walked up, found the root workspace and refused to build.
#
# It would have bitten a generated repository the same way. A template that does
# not obey the estate's rules produces repositories that start out breaking
# them — doc/governance/rust-style.md section 4.
[workspace]

[package]
name = "xmip-core-library-ssh"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-library-ssh"
description = "SSH for Xmip: the wire types, the transport layer, user authentication, a session channel, and keys, signatures and fingerprints."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# The estate's encoding primitives: the byte cursor and writer the SSH types
# are read off and laid out beside, base64 for a fingerprint, and the random
# bytes a cookie, padding and key are drawn from.
codec = { package = "xmip-core-library-codec", git = "https://github.com/IlleNilsson/xmip-core-library-codec", branch = "main" }
# The peer's identification line read under its ceiling (`net::read`), and
# the error a refusal travels in, a connection's keeping its kind.
net = { package = "xmip-core-library-net", git = "https://github.com/IlleNilsson/xmip-core-library-net", branch = "main" }
# The cryptography: one key-exchange curve, one cipher suite (aes256-ctr
# with hmac-sha2-256), and the three key types a signature is checked with
# (RFC 8709, RFC 5656, RFC 8332).
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
p256 = { version = "0.13", features = ["ecdsa"] }
# RSA's own SHA-256 (`rsa::sha2`): rsa 0.9, the newest release, is built
# on the digest generation before sha2 0.11's.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.11"
aes = "0.9"
ctr = "0.10"
hmac = "0.13"

[dev-dependencies]
# The tests generate an RSA key.
rand = "0.8"

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
